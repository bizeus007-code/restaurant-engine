
<!DOCTYPE html>
<html>
<head>
<link href='https://fonts.googleapis.com/css2?family=Cinzel:wght@700&family=Playfair+Display:wght@700&display=swap' rel='stylesheet'>
<style>
body { background: #111; color: #fff; padding: 40px; font-size: 32px; font-family: 'Playfair Display', serif; }
.gold {
  background: linear-gradient(135deg, #FBE291, #E5C158, #C8982B);
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
  font-weight: 700;
  font-style: normal;
}
.cinzel { font-family: 'Cinzel', serif; letter-spacing: 0.05em; }
.playfair { font-family: 'Playfair Display', serif; letter-spacing: 0.02em; }
</style>
</head>
<body>
<div>A (Playfair Display Roman - unified font-serif):<br>
  Gerçek <span class='gold playfair'>LOQUM ET</span> Deneyimi
</div>
<br><br>
<div>B (Cinzel - font-display):<br>
  Gerçek <span class='gold cinzel'>LOQUM ET</span> Deneyimi
</div>
</body>
</html>
